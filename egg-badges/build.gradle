plugins { id 'fabric-loom' version '1.10.5' }
loom { accessWidenerPath = file('src/main/resources/egg-badges.accesswidener') }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly 'maven.modrinth:cobblemon:kF7CvxTo'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
